; PlatformIO 工程配置 —— 微雪 ESP32-S3-DEV-KIT-N8R8
; 用法：VSCode 中 文件 → 打开文件夹，选本目录（fzyt28_bringup），
;       左下角 PlatformIO 工具栏 ✓ 编译、→ 烧录、🔌 串口监视器。
; 同一目录也能直接用 Arduino IDE 打开 fzyt28_bringup.ino。

[platformio]
src_dir = .

[env:waveshare-esp32s3-n8r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N8R8：8MB QIO Flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; USB CDC On Boot = Enabled：Serial 走原生 USB，Serial0 走 CH343
; （esp32-s3-devkitc-1 板定义已带 -DARDUINO_USB_MODE=1，即 Hardware CDC and JTAG）
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = direct
