<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FZYT-28 云台控制</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa3ad;
      --line: #2a2f38; --accent: #3b82f6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa3ad;
    --line: #2a2f38; --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px; max-width: 520px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 12px 14px; cursor: pointer; min-width: 64px;
    touch-action: manipulation; user-select: none;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.danger { color: var(--danger); }
  button.hold { padding: 18px 14px; font-weight: 600; }
  button.hold.active { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid button { min-width: 0; }
  .pos { font-size: 40px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.1; }
  .muted { color: var(--muted); font-size: 14px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  input[type=range] { width: 100%; }
  input[type=text] {
    font: inherit; flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  pre {
    margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; height: 180px; overflow: auto; font: 12px/1.45 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  .warn { color: var(--warn); font-size: 14px; }
</style>
</head>
<body>
<h1>FZYT-28 云台控制</h1>

<div class="card">
  <div class="row">
    <span><span id="dot" class="dot"></span><span id="state">未连接</span></span>
    <span style="flex:1"></span>
    <button id="btnConnect" class="primary">连接电机</button>
    <button id="btnDisconnect" disabled>断开</button>
  </div>
  <div id="support" class="warn" hidden></div>
</div>

<div class="card">
  <div class="muted">当前位置</div>
  <div class="pos"><span id="deg">--</span>°</div>
  <div class="muted"><span id="counts">--</span> 计数 · 扭矩 <span id="torque">--</span></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span class="muted">按住持续转动</span>
    <span><b id="speedVal">60</b>°/s</span>
  </div>
  <input id="speed" type="range" min="10" max="360" value="60" step="10">
  <div class="grid" style="grid-template-columns:1fr 1fr; margin-top:8px">
    <button id="holdL" class="hold">◀◀ 按住左转</button>
    <button id="holdR" class="hold">按住右转 ▶▶</button>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="muted">连环巡航 幅度±</span>
    <input id="swAmp" type="number" value="30" style="width:56px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text)">
    <span class="muted">°（以当前位置为中心）</span>
    <span style="flex:1"></span>
    <button id="btnSweep" class="hold">⟳ 开始巡航</button>
  </div>
</div>

<div class="card">
  <div class="muted" style="margin-bottom:8px">点动（相对当前位置）</div>
  <div class="grid">
    <button data-jog="-45">◀ 45°</button>
    <button data-jog="-15">◀ 15°</button>
    <button data-jog="15">15° ▶</button>
    <button data-jog="45">45° ▶</button>
    <button data-jog="-5">◀ 5°</button>
    <button data-jog="-1">◀ 1°</button>
    <button data-jog="1">1° ▶</button>
    <button data-jog="5">5° ▶</button>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span class="muted">转到绝对角度</span>
    <span><b id="sliderVal">0</b>°</span>
  </div>
  <input id="slider" type="range" min="-180" max="180" value="0" step="1">
  <div class="row" style="margin-top:8px">
    <button data-go="-90">-90°</button>
    <button data-go="0">0°</button>
    <button data-go="90">90°</button>
    <button data-go="180">180°</button>
    <span style="flex:1"></span>
    <button id="btnGo" class="primary">转到</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <button id="btnTorqueOn">扭矩开</button>
    <button id="btnTorqueOff" class="danger">扭矩关（松开）</button>
    <span style="flex:1"></span>
    <label class="muted"><input id="pollOn" type="checkbox" checked> 自动刷新位置</label>
    <button id="btnPos">读位置</button>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span class="muted">归零 · 头（电机）</span>
    <span class="muted">原始 <b id="rawCounts">--</b> 计数</span>
  </div>
  <div class="muted" style="margin:6px 0">用上面的左右/点动把头转到你要当作 0° 的位置，再点"设为零点"（存在 ESP32 里，掉电不丢，不写电机）</div>
  <div class="row">
    <button id="btnSetHome" class="primary">设当前为零点</button>
    <button id="btnGoHome">回零点 (0°)</button>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span class="muted">舵机（GPIO4）</span>
    <span><b id="servoVal">90</b>° · Home <b id="servoHomeVal">90</b>°</span>
  </div>
  <input id="servo" type="range" min="0" max="180" value="90" step="1">
  <div class="grid" style="margin-top:8px">
    <button data-sjog="-15">◀ 15°</button>
    <button data-sjog="-5">◀ 5°</button>
    <button data-sjog="5">5° ▶</button>
    <button data-sjog="15">15° ▶</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button data-servo="0">0°</button>
    <button data-servo="90">90°</button>
    <button data-servo="180">180°</button>
    <span style="flex:1"></span>
    <button id="btnServoHome">设Home</button>
    <button id="btnServoGoHome">回Home</button>
    <button id="btnServoOff">松开</button>
  </div>
  <div class="row" style="margin-top:8px; border-top:1px solid var(--line); padding-top:8px">
    <span class="muted">标定 脉宽</span>
    <button data-sus="-40">−</button>
    <button data-sus="40">＋</button>
    <span class="muted"><b id="servoUs">--</b>µs</span>
    <span style="flex:1"></span>
    <button id="btnSetOpen">设全开(0°)</button>
    <button id="btnSetClosed">设全关(180°)</button>
  </div>
  <div class="muted" style="margin-top:4px">标定：用 −/＋ 把镜头调到"全开"→设全开；调到"全关"→设全关。之后 0°=全开 180°=全关 90°=半开</div>
  <div class="row" style="margin-top:8px">
    <span class="muted">连环巡航</span>
    <input id="ssA" type="number" value="60" style="width:64px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text)">
    <span class="muted">~</span>
    <input id="ssB" type="number" value="120" style="width:64px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text)">
    <span class="muted">°</span>
    <span style="flex:1"></span>
    <button id="btnServoSweep">⟳ 巡航</button>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span class="muted">灯（GPIO5）</span>
    <span><b id="ledVal">0</b>%</span>
  </div>
  <input id="led" type="range" min="0" max="100" value="0" step="1">
  <div class="row" style="margin-top:8px">
    <button data-led="0">关</button>
    <button data-led="25">25%</button>
    <button data-led="50">50%</button>
    <button data-led="100">全亮</button>
    <span style="flex:1"></span>
    <button id="btnLedFade">2 秒渐变</button>
    <button id="btnBreathe">♨ 呼吸</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <input id="cmd" type="text" placeholder="任意命令，例如 st read 0x38 2" autocomplete="off">
    <button id="btnSend">发送</button>
  </div>
  <pre id="log" style="margin-top:8px"></pre>
</div>

<script>
// 与固件里的 Nordic UART 服务对应（fzyt28_bringup.ino 的 BLE_*_UUID）
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';   // 我们写
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';   // 电机通知

const $ = id => document.getElementById(id);
let device = null, rxChar = null, pollTimer = null, busy = false, connected = false;
const enc = new TextEncoder(), dec = new TextDecoder();
// 传输模式：从 ESP32 热点用 http 打开 = WiFi 模式(fetch)；从 GitHub Pages(https)/本地(file) = 蓝牙模式
const WIFI = location.protocol === 'http:';

function log(line, dir) {
  const el = $('log');
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el.textContent += `${t} ${dir || ' '} ${line}\n`;
  el.scrollTop = el.scrollHeight;
}

// 判断 Web 蓝牙是否可用，不可用时给出针对性原因（HTTPS / iOS / 浏览器不支持）
function bluetoothStatus() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (window.isSecureContext === false)
    return { ok: false, msg: '⚠ 必须用 HTTPS 打开才能连蓝牙。手机请用在线地址：https://codingmcnugget.github.io/920demo/webapp/ （file:// 或普通 http 会被浏览器禁用蓝牙）。' };
  if (!navigator.bluetooth) {
    if (isIOS)
      return { ok: false, msg: '⚠ iOS 的 Safari 和 Chrome 都不支持 Web 蓝牙。请在 App Store 装「Bluefy」浏览器打开本页，或改用安卓手机 / 电脑的 Chrome、Edge。' };
    return { ok: false, msg: '⚠ 此浏览器不支持 Web 蓝牙。请用安卓 Chrome/Edge，或电脑 Chrome/Edge。' };
  }
  return { ok: true, msg: '' };
}

function setConnected(on, name) {
  connected = on;
  $('dot').classList.toggle('on', on);
  $('state').textContent = on ? `已连接 ${name}` : '未连接';
  $('btnConnect').disabled = on;
  $('btnDisconnect').disabled = !on;
  document.querySelectorAll('[data-jog],[data-go],[data-servo],[data-led],[data-sjog],#btnGo,#btnTorqueOn,#btnTorqueOff,#btnPos,#btnSend,#btnServoOff,#btnLedFade,#btnSetHome,#btnGoHome,#btnServoHome,#btnServoGoHome,#btnSweep,#btnBreathe,#btnServoSweep,#btnSetOpen,#btnSetClosed,[data-sus],.hold')
    .forEach(b => b.disabled = !on);
  if (!on) { $('deg').textContent = '--'; $('counts').textContent = '--'; $('torque').textContent = '--'; }
}

// 解析电机/固件返回的文本行（蓝牙通知 或 WiFi 的 /cmd 响应，格式相同）
function handleIncoming(text) {
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    log(line.trim(), '←');
    const m = line.match(/当前位置 = (\d+) 计数 = (-?[\d.]+)°/);
    if (m) { $('counts').textContent = m[1]; $('deg').textContent = m[2]; $('rawCounts').textContent = m[1]; }
    const t = line.match(/扭矩 = (开|关)/);
    if (t) $('torque').textContent = t[1];
    const g = line.match(/^OK (go|jog) -> (-?[\d.]+)°/);
    if (g) $('torque').textContent = '开';
    const su = line.match(/\((\d+) µs\)/);
    if (su) { servoCurUs = parseInt(su[1]); $('servoUs').textContent = su[1]; }
    const sc = line.match(/当前=(\d+)µs/);
    if (sc) { servoCurUs = parseInt(sc[1]); $('servoUs').textContent = sc[1]; }
  }
}
function onNotify(ev) { handleIncoming(dec.decode(ev.target.value)); }   // 蓝牙通知

async function send(cmd) {
  log(cmd, '→');
  if (WIFI) {
    try { const r = await fetch('/cmd?c=' + encodeURIComponent(cmd)); handleIncoming(await r.text()); }
    catch (e) { log('发送失败: ' + e.message, '!'); }
    return;
  }
  if (!rxChar) return;
  const data = enc.encode(cmd + '\n');
  try {
    if (rxChar.properties.writeWithoutResponse) await rxChar.writeValueWithoutResponse(data);
    else await rxChar.writeValue(data);
  } catch (e) { log('发送失败: ' + e.message, '!'); }
}

async function connect() {
  { const bt = bluetoothStatus(); if (!bt.ok) { $('support').textContent = bt.msg; $('support').hidden = false; log(bt.msg, '!'); return; } }
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    device.addEventListener('gattserverdisconnected', () => { stopPoll(); setConnected(false); log('连接断开', '!'); });
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    rxChar = await svc.getCharacteristic(RX);
    const txChar = await svc.getCharacteristic(TX);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', onNotify);
    setConnected(true, device.name || '');
    log('已连接 ' + device.name, '!');
    await send('st pos');
    await send('servo cal');
    startPoll();
  } catch (e) {
    log('连接失败: ' + e.message, '!');
  }
}

function disconnect() {
  holdEnd();
  stopPoll();
  if (device && device.gatt.connected) device.gatt.disconnect();
  setConnected(false);
}

// 每 700ms 读一次位置。发命令时略过一轮，避免和按钮命令挤在一起
function startPoll() {
  stopPoll();
  pollTimer = setInterval(() => { if (!busy && !sweeping && $('pollOn').checked) send('st pos'); }, 700);
}
function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

async function action(cmd) {
  busy = true;
  await send(cmd);
  setTimeout(() => { busy = false; }, 150);
}

// 按住持续转动：按下每 300ms 发一次 st run（固件 700ms 没收到就自动停），松开发 st stop
let holdTimer = null;
function holdStart(btn, sign) {
  if (!connected || holdTimer) return;
  stopSweepUI();
  btn.classList.add('active');
  busy = true;                                   // 按住期间暂停位置轮询，让总线只跑 run
  const tick = () => send('st run ' + (sign * parseInt($('speed').value)));
  tick();
  holdTimer = setInterval(tick, 300);
}
function holdEnd() {
  if (!holdTimer) return;
  clearInterval(holdTimer); holdTimer = null;
  document.querySelectorAll('.hold').forEach(b => b.classList.remove('active'));
  send('st stop');
  setTimeout(() => { busy = false; }, 300);
}
for (const [id, sign] of [['holdL', -1], ['holdR', 1]]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); holdStart(b, sign); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, holdEnd);
  b.addEventListener('contextmenu', e => e.preventDefault());
}
window.addEventListener('blur', holdEnd);
$('speed').oninput = () => { $('speedVal').textContent = $('speed').value; };

// 舵机 / 灯：滑条拖动时限流，最多每 120ms 发一次，松手再发最终值
function throttled(fn, ms) {
  let t = null, last = 0, pending = null;
  return v => {
    pending = v;
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(pending); pending = null; }
    else if (!t) t = setTimeout(() => { t = null; last = Date.now(); if (pending !== null) { fn(pending); pending = null; } }, ms - (now - last));
  };
}
const servoSend = throttled(v => send('servo ' + v), 120);
const ledSend = throttled(v => send('led ' + v), 120);
$('servo').oninput = () => { stopServoSweepUI(); $('servoVal').textContent = $('servo').value; servoSend($('servo').value); };
$('servo').onchange = () => send('servo ' + $('servo').value);
$('led').oninput = () => { stopBreatheUI(); $('ledVal').textContent = $('led').value; ledSend($('led').value); };
$('led').onchange = () => send('led ' + $('led').value);
document.querySelectorAll('[data-servo]').forEach(b => b.onclick = () => { stopServoSweepUI(); $('servo').value = b.dataset.servo; $('servoVal').textContent = b.dataset.servo; action('servo ' + b.dataset.servo); });
document.querySelectorAll('[data-led]').forEach(b => b.onclick = () => { stopBreatheUI(); $('led').value = b.dataset.led; $('ledVal').textContent = b.dataset.led; action('led ' + b.dataset.led); });
$('btnServoOff').onclick = () => { stopServoSweepUI(); action('servo off'); };
$('btnLedFade').onclick = () => { stopBreatheUI(); action('led ' + $('led').value + ' 2000'); };

// ---- 软件归零：任意位置设为 home（存 ESP32 NVS，不写电机 EEPROM）----
$('btnSetHome').onclick = () => { stopSweepUI(); action('st home'); };
$('btnGoHome').onclick = () => { stopSweepUI(); action('st go 0'); };

// ---- 特效：连环巡航 / 呼吸灯（固件自主跑，软件只发一次开始/停止，蓝牙延迟不影响流畅度）----
let sweeping = false, breathing = false, servoSweeping = false;
function setSweepUI(on) { sweeping = on; $('btnSweep').classList.toggle('active', on); $('btnSweep').textContent = on ? '■ 停止巡航' : '⟳ 开始巡航'; }
function stopSweepUI() { if (sweeping) setSweepUI(false); }   // 手动运动时只更新界面（固件已自动停巡航）
$('btnSweep').onclick = () => {
  if (sweeping) { setSweepUI(false); action('st stop'); return; }
  const amp = Math.abs(parseFloat($('swAmp').value)) || 30;
  setSweepUI(true);
  // 固件端 st cruise 会自己读当前位置作中心，网页不用先读角度（BLE 下异步会读到旧值）
  action('st cruise ' + amp + ' ' + $('speed').value);
};
function setBreatheUI(on) { breathing = on; $('btnBreathe').classList.toggle('active', on); $('btnBreathe').textContent = on ? '■ 停呼吸' : '♨ 呼吸'; }
function stopBreatheUI() { if (breathing) setBreatheUI(false); }
$('btnBreathe').onclick = () => {
  if (breathing) { setBreatheUI(false); action('led off'); $('led').value = 0; $('ledVal').textContent = 0; }
  else { setBreatheUI(true); action('led breathe 3000 0 100'); }
};
function setServoSweepUI(on) { servoSweeping = on; $('btnServoSweep').classList.toggle('active', on); $('btnServoSweep').textContent = on ? '■ 停' : '⟳ 巡航'; }
function stopServoSweepUI() { if (servoSweeping) setServoSweepUI(false); }
$('btnServoSweep').onclick = () => {
  if (servoSweeping) { setServoSweepUI(false); action('servo off'); }
  else { setServoSweepUI(true); action('servo sweep ' + $('ssA').value + ' ' + $('ssB').value); }
};

// ---- 舵机开合标定：用脉宽微调找到全开/全关物理端点，再标定 ----
let servoCurUs = 1500;
document.querySelectorAll('[data-sus]').forEach(b => b.onclick = () => {
  stopServoSweepUI();
  servoCurUs = Math.max(500, Math.min(2500, servoCurUs + parseInt(b.dataset.sus, 10)));
  action('servo us ' + servoCurUs);
});
$('btnSetOpen').onclick = () => { action('servo setopen'); setTimeout(() => send('servo cal'), 200); };
$('btnSetClosed').onclick = () => { action('servo setclosed'); setTimeout(() => send('servo cal'), 200); };

// ---- 舵机点动 / Home（开环，Home 存在浏览器本地）----
let servoHome = parseInt(localStorage.getItem('servoHome') || '90', 10);
$('servoHomeVal').textContent = servoHome;
function setServo(v) { stopServoSweepUI(); v = Math.max(0, Math.min(180, Math.round(v))); $('servo').value = v; $('servoVal').textContent = v; action('servo ' + v); }
document.querySelectorAll('[data-sjog]').forEach(b => b.onclick = () => setServo(parseInt($('servo').value, 10) + parseInt(b.dataset.sjog, 10)));
$('btnServoHome').onclick = () => { servoHome = parseInt($('servo').value, 10); localStorage.setItem('servoHome', servoHome); $('servoHomeVal').textContent = servoHome; log('舵机 Home 设为 ' + servoHome + '°', '!'); };
$('btnServoGoHome').onclick = () => setServo(servoHome);

$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = disconnect;
document.querySelectorAll('[data-jog]').forEach(b => b.onclick = () => { stopSweepUI(); action('st jog ' + b.dataset.jog); });
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { stopSweepUI(); $('slider').value = b.dataset.go; $('sliderVal').textContent = b.dataset.go; action('st go ' + b.dataset.go); });
$('slider').oninput = () => { $('sliderVal').textContent = $('slider').value; };
$('btnGo').onclick = () => { stopSweepUI(); action('st go ' + $('slider').value); };
$('btnTorqueOn').onclick = () => action('st torque on');
$('btnTorqueOff').onclick = () => action('st torque off');
$('btnPos').onclick = () => action('st pos');
$('btnSend').onclick = () => { const c = $('cmd').value.trim(); if (c) { action(c); $('cmd').value = ''; } };
$('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnSend').click(); });

{ const bt = bluetoothStatus(); if (!bt.ok) { $('support').textContent = bt.msg; $('support').hidden = false; $('btnConnect').disabled = true; } }
setConnected(false);
